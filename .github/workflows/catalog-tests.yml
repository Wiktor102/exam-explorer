name: Catalog tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-tests:
    name: INF.04 catalog regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PDF dependency
        run: python -m pip install -r scripts/requirements-catalog.txt

      - name: Run catalog regression tests
        run: python -m unittest discover -s scripts -p 'test_generate_catalog.py' -v
